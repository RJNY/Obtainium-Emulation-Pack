[project]
name = "obtainium-emulation-pack-fork"
version = "7.16.0"
description = "An Obtainium import file containing an Android emulation pack "
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]


[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
    "SIM108", # ternary operator suggestions (readability tradeoff)
]

[tool.ruff.lint.isort]
known-first-party = ["constants", "utils", "help_formatter"]

[tool.ruff.format]
quote-style = "double"